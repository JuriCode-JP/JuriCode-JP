[project]
name = "juricode-verifier"
version = "0.1.0"
description = "Domain-independent source-citation verification for legal RAG: verbatim quote snapping, citation existence checks, and text-hash verification"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "CHOKAI Co.,Ltd.", email = "sato@chokaijp.com" },
]
requires-python = ">=3.11"
keywords = ["legal", "japan", "rag", "citation", "verification", "juricode-jp"]

# Intentionally empty: the verifier is stdlib-only so that any consumer
# (chat services, MCP servers, other domains) can adopt it without a
# dependency footprint.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/JuriCode-JP/JuriCode-JP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juricode_verifier"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
