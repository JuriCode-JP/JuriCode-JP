# JuriCode-JP — Continuous Integration
#
# Runs on:
#   - every push to main
#   - every pull request targeting main
#
# Steps:
#   1. Lint (ruff)
#   2. Run pytest across all workspace packages
#   3. Validate every law data file (data/ + examples/) against the IR
#   4. Regenerate the JSON Schema from IR and verify it is in sync
#      (fails if a contributor edits the Pydantic IR without re-exporting
#      the schema — keeps schema/juricode-article.schema.json honest)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint, test, validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        # 2026-07-13: packages/ (juricode-verifier) を lint 対象に追加.
        run: ruff check tools/ packages/

      - name: Ruff (format check)
        run: ruff format --check tools/ packages/

      - name: Pytest (all workspace packages)
        # 2026-05-25: tools/parse/v0.2/tests と manifest/tests を追加.
        # 2026-05-30: tools/search-ui/tests を追加 (柱5 質問ログ: endpoints / html smoke / server_main).
        # 2026-06-24: NTA 通達パーサの CI-safe な構造監査テストを追加
        # (法人税 byte 回帰 FU-514 / 消費税取込). byte 回帰層は cache 不在の CI では
        # 自動 skip.
        # 2026-06-25 FU-520: test_taxanswer_related.py を hermetic 化して CI に戻した.
        # 旧来は build/chunks/ (gitignored) の tsutatsu corpus を実行時参照していたため
        # CI 不在環境で全 unlink になり除外していたが、最小 committed corpus fixture
        # (tools/parse/tests/fixtures/taxanswer-tsutatsu-corpus.min.jsonl) をテストが
        # 注入することで build/chunks 非依存になった (ロック済期待値は不変).
        # PYTHONPATH を明示し juricode_shared 解決を rootdir 依存から切り離す (belt-and-suspenders).
        # 2026-07-13: juricode-verifier (packages/) の tests を追加し、serve の
        # test_snap.py は同パッケージへ移設 (tools/serve/tests/test_snap.py は削除).
        # PYTHONPATH に packages/juricode-verifier/src を追加 (guards.py が import する).
        # 2026-07-13: 引用レジストリ (W6 MVP) builder の hermetic tests を追加
        # (tools/registry/tests/test_build_registry.py). 合成 tmp_path fixture のみで
        # build/ 非依存 (CI-safe). root pyproject testpaths と本列挙の両所に配線.
        env:
          PYTHONPATH: "tools/shared/src:packages/juricode-verifier/src"
        run: |
          pytest packages/juricode-verifier/tests tools/shared/tests tools/validate/tests tools/parse/tests/test_tsutatsu_byte_regression.py tools/parse/tests/test_shouhi_tsutatsu.py tools/parse/tests/test_tsutatsu_multichapter.py tools/parse/tests/test_sochi_hojin_tsutatsu.py tools/parse/tests/test_sochi_joto_tsutatsu.py tools/parse/tests/test_sochi_shotoku_tsutatsu.py tools/parse/tests/test_sochi_sozoku_tsutatsu.py tools/parse/tests/test_sochi_kabushiki_tsutatsu.py tools/parse/tests/test_sochi_gensen_tsutatsu.py tools/parse/tests/test_sochi_40jou_tsutatsu.py tools/parse/tests/test_taxanswer_related.py tools/parse/tests/test_sochi_promotion_guards.py tools/parse/tests/test_kfs_saiketsu.py tools/parse/tests/test_kfs_eda_ban_regression.py tools/parse/tests/test_kfs_multi_article.py tools/parse/tests/test_kfs_appendix_amend_guard.py tools/parse/tests/test_hojin_rulings_store.py tools/parse/tests/test_hojin_precedents_store.py tools/parse/tests/test_keihou_precedents_store.py tools/parse/tests/test_sozoku_rulings_store.py tools/parse/tests/test_shohi_rulings_store.py tools/parse/tests/test_shotoku_rulings_store.py tools/parse/tests/test_kokutsu_rulings_store.py tools/parse/tests/test_shotoku_corpus.py tools/parse/tests/test_souzoku_corpus.py tools/parse/tests/test_hyoka_corpus.py tools/parse/tests/test_hojin_taxanswer_corpus.py tools/parse/tests/test_sozoku_taxanswer_corpus.py tools/parse/tests/test_shohi_taxanswer_corpus.py tools/parse/tests/test_gensen_taxanswer_corpus.py tools/parse/tests/test_shotoku_taxanswer_corpus.py tools/parse/tests/test_joto_taxanswer_corpus.py tools/parse/tests/test_inshi_taxanswer_corpus.py tools/amendments/tests/test_shouhi_amendments.py tools/amendments/tests/test_souzoku_amendments.py tools/amendments/tests/test_houjin_amendments.py tools/amendments/tests/test_shotoku_amendments.py tools/amendments/tests/test_chain_hardening.py tools/amendments/tests/test_kokutsu_amendments.py tools/parse/v0.2/tests tools/parse/v0.2/manifest/tests tools/search-ui/tests tools/fetch-egov/tests/test_tsutatsu_fetcher.py tools/embed/tests/test_v8_prep_audit.py tools/embed/tests/test_build_v8_corpus.py tools/embed/tests/test_filter_v8_embed.py tools/embed/tests/test_retrieve_dedup.py tools/embed/tests/test_vec_json.py tools/serve/tests/test_retrieval_server.py tools/serve/tests/test_guards.py tools/serve/tests/test_chat_server.py tools/scripts/tests/test_check_no_leaks.py tools/registry/tests/test_build_registry.py tools/dist/tests/test_scan_artifacts.py tools/scripts/tests/test_verify_gates_lock.py tools/serve/tests/test_reproduce_a3_verdict.py tools/scripts/tests/test_run_ci_pytest_parity.py -v

      - name: Validate all law data files
        # 2026-05-25: data/phase1-*/ (v0.1) を archive/v0.1/ に deprecate 済.
        # 本コマンドは data/ 配下のみ走査する (archive/ は対象外、
        # find_data_files() が data/ + examples/ のみを見るため).
        # 結果として v0.2 corpus (data/v0.2/) のみが検証対象になる.
        run: python tools/validate/validate-all.py

      - name: Verify source-manifest hashes (parse pipeline / Layer 3)
        # data/ 配下の _source-manifest.json と Markdown 本文の hash 整合確認.
        # 法令本文の改変・誤転記を CI で機械的に検知する.
        # 2026-05-25: v0.1 corpus を archive/v0.1/ に deprecate. data/v0.2/ 配下の
        # 43 manifests (11,758 articles) が対象となる. archive/ は CI 対象外.
        # 詳細: docs/verification-framework.md /
        #       business/v02-corpus-quality-investigation-2026-05-25.md
        run: python tools/parse/verify.py --path data

      - name: Phase tag consistency check (FU-415 guard, FU-502)
        # 2026-05-26 FU-502: tags[0] が path-derived な phase と一致するかを
        # CI で機械的に検知する. fix-phase-tags.py --check-only は mismatch
        # 1 件でも exit 1 で fail.
        # 過去の bulk-ingest で tags[0] が phase1-police にハードコードされた
        # bug (FU-401 で修正、FU-415 で sweep 完了) の退行を防ぐ.
        # 実 CLI 起動は tools/shared/tests/test_fix_phase_tags_cli.py が
        # smoke test として担保 (FU-504 entry point 修復後の退行検知).
        run: python tools/scripts/fix-phase-tags.py --path data/v0.2 --check-only

      - name: Canonical md residue check (G0-e)
        # 正本 md の **ファイル全体** に残骸が無いこと:
        #   (1) 内部マーカー `<!-- ... -->` が 0
        #   (2) `## 原文` の外に本文由来のテキストが 0
        #
        # Why 独立ステップか: G0 ゲート本体は ground truth に e-Gov XML
        # (cache/laws, 133MB, gitignored) を要求するため CI で走らない。
        # G0-e だけは XML 不要なので、CI で常設できる。
        #
        # Why 必要か: G0-a〜d は「原文セクションの中身」しか見ていない。
        # 検査範囲の外にあるものはゲートが緑でも残り続ける。実際 2026-07-14 に
        # G0-a/b/c/d を全部緑にして「マーカー 0」と報告した後、セクション外に
        # マーカー 1 件 + 本文の残骸 17 件が残っていた。
        run: python tools/scripts/check-md-residue.py --path data/v0.2

      - name: Validate v0.2 corpus phase mapping (FU-503)
        # 2026-05-26 FU-503: build-v0.2-corpus.py の build_law_to_phase /
        # build_article_to_caption が data/v0.2/ から想定の 43 laws / 8 phases /
        # 9000+ captions を抽出できることを assert.
        # build/chunks/ は .gitignore 対象で CI に不在のため、chunk merge は
        # 走らせず mapping check のみ (Option α).
        # 過去の bug: FU-108 で corpus 移動した際 --data-dir default が data/
        # のままで law -> phase mapping: 0 laws となった (FU-501 で修復). 同種の
        # 退行 (新 phase 追加時の build_law_to_phase 不対応等) を CI で検知.
        # 実 CLI 起動は tools/shared/tests/test_build_v02_corpus_cli.py が
        # smoke test として担保 (Layer 1 RET503 + Layer 2 smoke test の 3 層防御).
        run: python tools/embed/build-v0.2-corpus.py --validate-only

      - name: Check cp932-safe (FU-505)
        # 2026-05-27 FU-505: tools/ 配下の全 .py (tests/ / __pycache__ / venv 除外) を
        # scan し、cp932-unsafe 文字 (em dash 等) がないことを assert.
        # Windows cp932 console での argparse `--help` UnicodeEncodeError crash を
        # 新規 script への再発から構造的に予防する (Layer 1 静的検査).
        # 2026-07-13: packages/ を追加 (--path は単一値のため 2 回呼ぶ).
        run: |
          python tools/scripts/check-cp932-safe.py --path tools
          python tools/scripts/check-cp932-safe.py --path packages

      - name: Verify locked eval-set golden checksum (FU-515 D-b)
        # 2026-06-21 FU-515 D-b: G1-local / G3-sp の golden answer key
        # (data/eval-set/tax-honbun-local/, data/eval-set/tax-supplproviso-probe/)
        # を AI agent が "eval を通すために" 改変する reward hacking を機械検知する.
        # 期待 digest はリポ外 (agent 書込スコープ外) の repository variable
        # EVALSET_GOLDEN_SHA256 から注入 (guard the guard / lock plan AC-7).
        # 未設定なら gate INACTIVE (exit 0) = secret 設定前の最初の PR を塞がない
        # ブリッジ. 正当な golden 更新は人間が tools/scripts/approve-eval-set.sh で
        # 再ハッシュし variable を更新する (AC-12). workflow file 自体は branch
        # protection で人間レビュー必須にすることで本ゲートの迂回を防ぐ.
        env:
          EVALSET_GOLDEN_SHA256: ${{ vars.EVALSET_GOLDEN_SHA256 }}
        run: python tools/scripts/verify-eval-set-checksum.py

      - name: Verify locked retrieval pass lines
        # The retrieval pass line (gates/pass-lines.json) is a contract, not a build
        # output. Its expected digest is injected from the repository variable
        # GATES_LOCK_SHA256 (out of the agent's write scope), so the pass line cannot
        # be quietly lowered to match a worse build. Same guard-the-guard pattern as
        # the eval-set checksum gate above. Unset -> gate INACTIVE (exit 0), the
        # pre-activation bridge so the first PR is not blocked; a human runs
        # tools/scripts/approve-gates-lock.sh and sets the variable to activate it.
        env:
          GATES_LOCK_SHA256: ${{ vars.GATES_LOCK_SHA256 }}
        run: python tools/scripts/verify-gates-lock.py

      - name: Regenerate JSON Schema and check for drift
        run: |
          python tools/shared/scripts/export-schema.py
          git diff --exit-code schema/juricode-article.schema.json || {
            echo ""
            echo "::error::schema/juricode-article.schema.json is out of sync with the Pydantic IR."
            echo "Run 'python tools/shared/scripts/export-schema.py' locally and commit the result."
            exit 1
          }
          git diff --exit-code schema/juricode-taxanswer.schema.json || {
            echo ""
            echo "::error::schema/juricode-taxanswer.schema.json is out of sync with the Pydantic IR."
            echo "Run 'python tools/shared/scripts/export-schema.py' locally and commit the result."
            exit 1
          }
          git diff --exit-code schema/juricode-directive.schema.json || {
            echo ""
            echo "::error::schema/juricode-directive.schema.json is out of sync with the Pydantic IR."
            echo "Run 'python tools/shared/scripts/export-schema.py' locally and commit the result."
            exit 1
          }
          git diff --exit-code schema/ruling-store.schema.json || {
            echo ""
            echo "::error::schema/ruling-store.schema.json is out of sync with the Pydantic IR."
            echo "Run 'python tools/shared/scripts/export-schema.py' locally and commit the result."
            exit 1
          }

  fidelity-gate:
    name: Build derived chunks and verify fidelity
    # Why build rather than store the retrieval chunks: they are derived, not
    # authored. The same versioned Markdown, the same versioned source XML, and the
    # same deterministic parser always produce the same bytes. So CI rebuilds them
    # from source and then verifies fidelity, which proves reproducibility (the build
    # succeeds and is deterministic) as well as fidelity (the gate passes) in one run
    # -- a stored copy would only ever prove the second. build/ is gitignored;
    # nothing is committed by this job.
    #
    # Why a separate job instead of folding into the matrix above: one Python version
    # is enough here. Rebuilding the chunks under Python 3.11 on Windows and under
    # Python 3.12 on Linux -- the exact two environments the local pre-push runner and
    # this job use -- produced byte-identical output for both builders, so a second
    # matrix version would add no signal. (This is the deployed-environment pair, not
    # a version-only isolation; it is exactly what makes "green locally" and "green in
    # CI" mean the same artefact.) A separate job also runs in parallel with
    # lint-and-test, keeping this off the wall-clock a human waits for.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The pipeline is build -> build -> verify, and each build is its own step so a
      # build failure and a fidelity violation never surface as the same red: if a
      # build breaks, the run says the build broke instead of leaving a fidelity
      # report to be reverse-engineered. The two builds are order-independent today,
      # but the order is pinned so that a future change to that property shows up here
      # as a diff rather than as a silent behaviour change.
      - name: Build segment chunks from canonical Markdown
        run: python tools/parse/v0.2/build_chunks_from_md.py

      - name: Build table chunks from source XML
        run: python tools/parse/v0.2/extract_table_from_xml.py

      - name: Verify fidelity (canonical md == source XML == derived chunks)
        run: python tools/parse/v0.2/g0_fidelity_gate.py

  leak-gate:
    name: Leak gate (names / internal refs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history to resolve base..HEAD
      - name: Fetch base
        run: git fetch origin "${{ github.base_ref || 'main' }}" --depth=0 || git fetch origin
      - name: Leak gate (names / internal refs)
        run: python3 tools/scripts/check_no_leaks.py --base "origin/${{ github.base_ref || 'main' }}" --head HEAD
